# ============================================================
# Nginx Configuration — Digital Signage Server
# ============================================================
# Copiar a: /etc/nginx/sites-available/digital-signage
# Habilitar: sudo ln -s /etc/nginx/sites-available/digital-signage /etc/nginx/sites-enabled/
# Probar:   sudo nginx -t
# Recargar: sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name _;  # Acepta cualquier hostname (usa la IP de tu Ubuntu)

    # Directorio raíz del proyecto
    root /var/www/digital-signage;
    index index.html;

    # ============================================================
    # Seguridad básica
    # ============================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ============================================================
    # CORS Headers (para Smart TVs que puedan necesitarlos)
    # ============================================================
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;

    # ============================================================
    # Service Worker — NO cachear, siempre fresco
    # ============================================================
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ============================================================
    # Manifest — Cache corto
    # ============================================================
    location = /manifest.json {
        add_header Cache-Control "no-cache, max-age=3600";
        try_files $uri =404;
    }

    # ============================================================
    # API / Playlist — NO cachear (cambios frecuentes)
    # ============================================================

    # GET de la playlist: Nginx la sirve directamente
    location = /api/playlist.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # Si es un PUT (guardar desde admin), enviarlo al servidor Python
        if ($request_method = PUT) {
            proxy_pass http://127.0.0.1:8080;
            break;
        }

        try_files $uri =404;
    }

    location /api/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ============================================================
    # Proxy de Audio — Reenvía audio externo como HTTPS
    # ============================================================
    location /api/audio/ {
        proxy_pass http://190.109.212.101:8000/ist;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "*/*";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;

        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range, Content-Type, Icy-MetaData";

        # No cachear audio proxy
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ============================================================
    # Videos — Range Requests + Cache largo
    # ============================================================
    location /content/videos/ {
        # Habilitar Range Requests (esencial para reproducción y seek)
        add_header Accept-Ranges bytes;

        # Cache de 7 días (el SW maneja la actualización)
        add_header Cache-Control "public, max-age=604800, immutable";

        # MIME types de video
        types {
            video/mp4  mp4;
            video/webm webm;
            video/ogg  ogg;
        }

        # Servir archivos directamente
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Buffer grande para archivos de video
        output_buffers 1 512k;

        try_files $uri =404;
    }

    # ============================================================
    # Imágenes de contenido — Cache largo
    # ============================================================
    location /content/images/ {
        add_header Cache-Control "public, max-age=604800";

        types {
            image/jpeg  jpg jpeg;
            image/png   png;
            image/webp  webp;
            image/gif   gif;
            image/svg+xml svg;
        }

        try_files $uri =404;
    }

    # ============================================================
    # Assets estáticos (CSS/JS) — Cache medio
    # ============================================================
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ============================================================
    # Admin Panel
    # ============================================================
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ============================================================
    # Página principal
    # ============================================================
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # Logs
    # ============================================================
    access_log /var/log/nginx/digital-signage-access.log;
    error_log  /var/log/nginx/digital-signage-error.log;

    # ============================================================
    # Límites para subida de archivos grandes (videos)
    # ============================================================
    client_max_body_size 500M;
}

# ============================================================
# NOTA: Para soporte de PUT en /api/playlist.json
# ============================================================
# Opción A (Recomendada): Usa un script simple en Python/Node
#   que escuche en un puerto local y guarde el JSON.
#
# Opción B: Usa el módulo DAV de Nginx:
#   location /api/ {
#       dav_methods PUT;
#       create_full_put_path on;
#       dav_access user:rw group:rw all:r;
#   }
#
# Opción C: Simplemente descarga el playlist.json desde el
#   admin y cópialo manualmente al servidor con SCP.
# ============================================================
